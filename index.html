<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Империя Шаурмы</title>
  
  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Стили -->
  <link rel="stylesheet" href="/css/styles.css">
  
  <!-- Supabase конфигурация (будет заменена через API) -->
  <script>
    // Эти значения будут загружены с сервера
    window.SUPABASE_URL = '';
    window.SUPABASE_KEY = '';
  </script>
  
  <style>
    @keyframes float-up {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
    }
    .float-number {
      animation: float-up 1s ease-out forwards;
      pointer-events: none;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-5px) rotate(-5deg); }
      75% { transform: translateX(5px) rotate(5deg); }
    }
    .shake { animation: shake 0.3s ease-in-out; }
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .achievement-popup { animation: slideInRight 0.5s ease-out; }
    @keyframes particle-burst {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
    }
    .particle { animation: particle-burst 0.8s ease-out forwards; }
    @keyframes pulse-golden {
      0%, 100% { transform: scale(1.2); filter: brightness(1); }
      50% { transform: scale(1.4); filter: brightness(1.3); }
    }
    #golden-shawarma {
      animation: pulse-golden 0.5s ease-in-out infinite;
      cursor: pointer;
    }
    @keyframes golden-shine {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .golden-shine {
      background: linear-gradient(90deg, transparent, rgba(255,215,0,0.5), transparent);
      background-size: 200% 100%;
      animation: golden-shine 2s infinite;
    }
    @keyframes bounce-in {
      0% { transform: scale(0); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .bounce-in { animation: bounce-in 0.5s ease-out; }
    
    /* Новые эффекты */
    @keyframes float-bg {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    #shawarma-btn {
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    #shawarma-btn:hover {
      filter: drop-shadow(0 0 20px rgba(251, 146, 60, 0.7));
    }
    #shawarma-btn:active {
      transform: scale(0.9) !important;
    }
    
    /* Анимированный фон */
    .bg-pattern {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      opacity: 0.1;
    }
    .bg-pattern span {
      position: absolute;
      font-size: 40px;
      animation: float-bg 6s ease-in-out infinite;
    }
    
    /* Эффект турбо */
    .turbo-active #shawarma-btn {
      animation: wiggle 0.1s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(255, 200, 0, 0.9)) !important;
    }
    
    .overflow-y-auto::-webkit-scrollbar { width: 8px; }
    .overflow-y-auto::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
    .overflow-y-auto::-webkit-scrollbar-thumb { background: #fb923c; border-radius: 10px; }
    .overflow-y-auto::-webkit-scrollbar-thumb:hover { background: #f97316; }
    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    body { overscroll-behavior: none; }
  </style>
</head>
<body class="bg-gradient-to-br from-orange-100 via-yellow-50 to-red-100">
  <!-- Экран загрузки -->
  <div id="app">
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center">
        <div class="text-6xl mb-4 animate-pulse">🌯</div>
        <div class="text-2xl font-bold text-orange-600">Загрузка игры...</div>
        <div class="text-sm text-gray-500 mt-2">Подключение к серверу</div>
      </div>
    </div>
  </div>

  <!-- Контейнер для уведомлений -->
  <div id="achievements-container" class="fixed top-20 right-4 z-50 space-y-2"></div>
  
  <!-- Контейнер для частиц -->
  <div id="particles-container" class="fixed inset-0 pointer-events-none z-40"></div>
  
  <!-- Модальное окно ежедневной награды -->
  <div id="daily-reward-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-8 max-w-sm mx-4 bounce-in">
      <div class="text-center">
        <div class="text-6xl mb-4">🎁</div>
        <h2 class="text-2xl font-bold text-orange-600 mb-2">Ежедневная награда!</h2>
        <p class="text-gray-600 mb-4">Возвращайся каждый день за бонусами!</p>
        <div class="bg-gradient-to-r from-orange-100 to-yellow-100 rounded-2xl p-6 mb-4">
          <div class="text-4xl font-bold text-orange-600" id="daily-reward-amount">+1000 🌯</div>
          <div class="text-sm text-gray-600 mt-2">День <span id="daily-streak">1</span></div>
        </div>
        <button data-action="claim-daily" class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold py-3 px-6 rounded-xl hover:from-orange-600 hover:to-red-600 transition-all">
          Забрать награду! 🎉
        </button>
      </div>
    </div>
  </div>

  <!-- Модальное окно престижа -->
  <div id="prestige-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-8 max-w-md mx-4 bounce-in">
      <div class="text-center">
        <div class="text-6xl mb-4">⭐</div>
        <h2 class="text-2xl font-bold text-orange-600 mb-2">Престиж</h2>
        <p class="text-gray-600 mb-4">Начни заново с мощными бонусами!</p>
        <div class="bg-gradient-to-r from-purple-100 to-pink-100 rounded-2xl p-6 mb-4">
          <div class="text-lg font-semibold mb-2">Текущий прогресс:</div>
          <div class="text-sm text-gray-600 space-y-1">
            <div>Всего шаурмы: <span class="font-bold text-orange-600" id="prestige-total">0</span></div>
            <div>Зданий куплено: <span class="font-bold text-orange-600" id="prestige-buildings">0</span></div>
          </div>
          <div class="mt-4 pt-4 border-t-2 border-purple-300">
            <div class="text-lg font-bold text-purple-600">Получишь: x<span id="prestige-bonus">1.5</span> множитель!</div>
            <div class="text-xs text-gray-500 mt-1">Применяется ко всему производству</div>
          </div>
        </div>
        <div class="flex gap-2">
          <button data-action="close-prestige" class="flex-1 bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl hover:bg-gray-400 transition-all">
            Отмена
          </button>
          <button data-action="confirm-prestige" class="flex-1 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-3 px-6 rounded-xl hover:from-purple-600 hover:to-pink-600 transition-all">
            Престиж! ⭐
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно лидерборда -->
  <div id="leaderboard-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-6 max-w-md mx-4 bounce-in w-full">
      <div class="text-center">
        <div class="text-4xl mb-2">🏆</div>
        <h2 class="text-2xl font-bold text-orange-600 mb-4">Топ игроков</h2>
        <div id="leaderboard-content" class="max-h-80 overflow-y-auto">
          <!-- Будет заполнено динамически -->
        </div>
        <button onclick="document.getElementById('leaderboard-modal').classList.add('hidden')" 
                class="mt-4 w-full bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl hover:bg-gray-400 transition-all">
          Закрыть
        </button>
      </div>
    </div>
  </div>

  <!-- Загрузка конфигурации и скриптов -->
  <script>
    console.log('🌯 Загрузка игры...');
    
    // Загружаем конфигурацию Supabase с сервера
    fetch('/api/config')
      .then(function(response) {
        return response.json();
      })
      .then(function(config) {
        window.SUPABASE_URL = config.supabaseUrl || '';
        window.SUPABASE_KEY = config.supabaseKey || '';
        console.log('✅ Конфигурация загружена');
        loadGameScripts();
      })
      .catch(function(error) {
        console.log('⚠️ Не удалось загрузить конфигурацию, работаем локально');
        window.SUPABASE_URL = '';
        window.SUPABASE_KEY = '';
        loadGameScripts();
      });
    
    // Загружаем скрипты ПОСЛЕДОВАТЕЛЬНО
    function loadGameScripts() {
      var scripts = [
        '/js/config.js',
        '/js/sounds.js',
        '/js/storage.js',
        '/js/supabase.js',
        '/js/events.js',
        '/js/slicer.js',
        '/js/chopper.js',
        '/js/game.js',
        '/js/ui.js',
        '/js/main.js'
      ];
      
      var index = 0;
      
      function loadNext() {
        if (index >= scripts.length) {
          console.log('✅ Все скрипты загружены');
          return;
        }
        
        var script = document.createElement('script');
        script.src = scripts[index];
        script.onload = function() {
          console.log('✅ Загружен:', scripts[index]);
          index++;
          loadNext();
        };
        script.onerror = function() {
          console.error('❌ Ошибка загрузки:', scripts[index]);
          document.getElementById('app').innerHTML = 
            '<div class="flex items-center justify-center min-h-screen p-4">' +
              '<div class="text-center bg-red-100 border-2 border-red-400 rounded-xl p-6">' +
                '<div class="text-4xl mb-4">❌</div>' +
                '<div class="text-xl font-bold text-red-600 mb-2">Ошибка загрузки</div>' +
                '<div class="text-sm text-gray-700">Файл: ' + scripts[index] + '</div>' +
                '<button onclick="location.reload()" class="mt-4 bg-red-500 text-white px-4 py-2 rounded-lg">Перезагрузить</button>' +
              '</div>' +
            '</div>';
        };
        document.body.appendChild(script);
      }
      
      loadNext();
    }
  </script>
</body>
</html>
