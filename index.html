<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Империя Шаурмы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-orange-100 via-yellow-50 to-red-100">
  <div id="app">
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center">
        <div class="text-6xl mb-4">🌯</div>
        <div class="text-2xl font-bold text-orange-600">Загрузка...</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Проверяем, запущено ли приложение в Telegram
      const isTelegram = window.Telegram && window.Telegram.WebApp;
      let tg = null;
      
      if (isTelegram) {
        tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
      } else {
        console.log('Запущено вне Telegram - режим браузера');
      }

      // ВАЖНО: Замени эти данные на свои из Supabase
      const SUPABASE_URL = 'https://cvxfavzuoneeaueqibie.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2eGZhdnp1b25lZWF1ZXFpYmllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5MTM0NzEsImV4cCI6MjA4NDQ4OTQ3MX0.23bcNd_X_uW6vXsF3TRkdalvdwWFg3Oz9A_F8_nt3go';
      
      let supabaseClient = null;
      
      // Инициализируем Supabase только если настроен
      if (SUPABASE_URL !== 'YOUR_SUPABASE_URL' && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }

      // Получаем ID пользователя
      const userId = isTelegram && tg.initDataUnsafe?.user?.id 
        ? tg.initDataUnsafe.user.id 
        : Math.floor(Math.random() * 1000000); // Случайный ID для браузера

      // Состояние игры
      const gameState = {
        shawarmas: 0,
        perClick: 1,
        perSecond: 0,
        buildings: [
          { id: 1, name: 'Стажёр', cost: 15, owned: 0, production: 0.1, emoji: '👨‍🍳' },
          { id: 2, name: 'Шаурмист', cost: 100, owned: 0, production: 1, emoji: '🧑‍🍳' },
          { id: 3, name: 'Киоск', cost: 500, owned: 0, production: 5, emoji: '🏪' },
          { id: 4, name: 'Кафе', cost: 3000, owned: 0, production: 20, emoji: '🍽️' },
          { id: 5, name: 'Ресторан', cost: 10000, owned: 0, production: 100, emoji: '🏢' },
          { id: 6, name: 'Сеть', cost: 50000, owned: 0, production: 500, emoji: '🌐' },
        ],
        upgrades: [
          { id: 1, name: 'Острый соус', cost: 50, purchased: false, clickBonus: 1 },
          { id: 2, name: 'Свежие овощи', cost: 200, purchased: false, clickBonus: 2 },
          { id: 3, name: 'Премиум мясо', cost: 1000, purchased: false, clickBonus: 5 },
        ]
      };

      // Загрузка данных из базы
      async function loadGameData() {
        try {
          // Проверяем localStorage
          const saved = localStorage.getItem('shawarma_game_' + userId);
          if (saved) {
            const data = JSON.parse(saved);
            gameState.shawarmas = data.shawarmas || 0;
            gameState.perClick = data.perClick || 1;
            
            // Загружаем здания
            if (data.buildings) {
              data.buildings.forEach(savedBuilding => {
                const building = gameState.buildings.find(b => b.id === savedBuilding.id);
                if (building) {
                  building.owned = savedBuilding.owned;
                  building.cost = savedBuilding.cost;
                }
              });
            }
            
            // Загружаем улучшения
            if (data.upgrades) {
              data.upgrades.forEach(savedUpgrade => {
                const upgrade = gameState.upgrades.find(u => u.id === savedUpgrade.id);
                if (upgrade) {
                  upgrade.purchased = savedUpgrade.purchased;
                }
              });
            }
          }

          // Если есть Supabase, пытаемся загрузить оттуда
          if (supabaseClient) {
            const { data: user, error: userError } = await supabaseClient
              .from('users')
              .select('*')
              .eq('id', userId)
              .single();

            if (userError && userError.code === 'PGRST116') {
              // Пользователь не найден, создаём нового
              await supabaseClient.from('users').insert([{
                id: userId,
                username: isTelegram ? (tg.initDataUnsafe?.user?.username || 'player') : 'browser_player',
                first_name: isTelegram ? (tg.initDataUnsafe?.user?.first_name || 'Player') : 'Player',
                shawarmas: gameState.shawarmas,
                per_click: gameState.perClick
              }]);
            } else if (user) {
              gameState.shawarmas = parseFloat(user.shawarmas);
              gameState.perClick = user.per_click;
            }

            // Загружаем здания
            const { data: buildings } = await supabaseClient
              .from('user_buildings')
              .select('*')
              .eq('user_id', userId);

            if (buildings) {
              buildings.forEach(b => {
                const building = gameState.buildings.find(gb => gb.id === b.building_id);
                if (building) building.owned = b.owned;
              });
            }

            // Загружаем улучшения
            const { data: upgrades } = await supabaseClient
              .from('user_upgrades')
              .select('*')
              .eq('user_id', userId);

            if (upgrades) {
              upgrades.forEach(u => {
                const upgrade = gameState.upgrades.find(gu => gu.id === u.upgrade_id);
                if (upgrade) upgrade.purchased = u.purchased;
              });
            }
          }

          calculateProduction();
          render();
        } catch (error) {
          console.error('Ошибка загрузки:', error);
          calculateProduction();
          render();
        }
      }

      // Сохранение данных
      async function saveGameData() {
        try {
          // Сохраняем локально
          const saveData = {
            shawarmas: gameState.shawarmas,
            perClick: gameState.perClick,
            buildings: gameState.buildings.map(b => ({ id: b.id, owned: b.owned, cost: b.cost })),
            upgrades: gameState.upgrades.map(u => ({ id: u.id, purchased: u.purchased }))
          };
          localStorage.setItem('shawarma_game_' + userId, JSON.stringify(saveData));

          // Сохраняем в Supabase если настроен
          if (supabaseClient) {
            await supabaseClient
              .from('users')
              .update({
                shawarmas: gameState.shawarmas,
                per_click: gameState.perClick,
                updated_at: new Date().toISOString()
              })
              .eq('id', userId);
          }
        } catch (error) {
          console.error('Ошибка сохранения:', error);
        }
      }

      // Расчёт производства
      function calculateProduction() {
        gameState.perSecond = gameState.buildings.reduce((sum, b) => 
          sum + (b.owned * b.production), 0
        );
        gameState.perClick = 1 + gameState.upgrades
          .filter(u => u.purchased)
          .reduce((sum, u) => sum + u.clickBonus, 0);
      }

      // Клик по шаурме
      function handleClick() {
        gameState.shawarmas += gameState.perClick;
        
        // Вибрация в Telegram
        if (isTelegram && tg.HapticFeedback) {
          tg.HapticFeedback.impactOccurred('light');
        }
        
        render();
      }

      // Покупка здания
      async function buyBuilding(buildingId) {
        const building = gameState.buildings.find(b => b.id === buildingId);
        if (gameState.shawarmas >= building.cost) {
          gameState.shawarmas -= building.cost;
          building.owned++;
          building.cost = Math.floor(building.cost * 1.15);
          
          // Сохраняем в базу Supabase
          if (supabaseClient) {
            await supabaseClient.from('user_buildings').upsert({
              user_id: userId,
              building_id: buildingId,
              owned: building.owned
            }, { onConflict: 'user_id,building_id' });
          }
          
          calculateProduction();
          await saveGameData();
          
          if (isTelegram && tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
          }
          
          render();
        }
      }

      // Покупка улучшения
      async function buyUpgrade(upgradeId) {
        const upgrade = gameState.upgrades.find(u => u.id === upgradeId);
        if (gameState.shawarmas >= upgrade.cost && !upgrade.purchased) {
          gameState.shawarmas -= upgrade.cost;
          upgrade.purchased = true;
          
          if (supabaseClient) {
            await supabaseClient.from('user_upgrades').upsert({
              user_id: userId,
              upgrade_id: upgradeId,
              purchased: true
            }, { onConflict: 'user_id,upgrade_id' });
          }
          
          calculateProduction();
          await saveGameData();
          
          if (isTelegram && tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
          }
          
          render();
        }
      }

      // Отрисовка интерфейса
      function render() {
        document.getElementById('app').innerHTML = `
          <div class="min-h-screen pb-20">
            <!-- Шапка -->
            <div class="bg-gradient-to-r from-orange-500 to-red-500 text-white p-4 shadow-lg sticky top-0 z-10">
              <h1 class="text-3xl font-bold text-center mb-2">🌯 Империя Шаурмы</h1>
              ${!isTelegram ? '<div class="text-center text-xs opacity-75 mb-2">🌐 Режим браузера</div>' : ''}
              <div class="flex justify-around items-center">
                <div class="text-center">
                  <div class="text-2xl font-bold">${Math.floor(gameState.shawarmas)}</div>
                  <div class="text-xs opacity-90">Шаурмы</div>
                </div>
                <div class="text-center">
                  <div class="text-lg font-bold">+${gameState.perClick}</div>
                  <div class="text-xs opacity-90">За клик</div>
                </div>
                <div class="text-center">
                  <div class="text-lg font-bold">+${gameState.perSecond.toFixed(1)}/сек</div>
                  <div class="text-xs opacity-90">Производство</div>
                </div>
              </div>
            </div>

            <div class="max-w-2xl mx-auto p-4 space-y-4">
              <!-- Кликер -->
              <div class="bg-white rounded-2xl p-8 shadow-xl">
                <div class="flex justify-center">
                  <button onclick="handleClickGlobal()" class="text-9xl transform active:scale-95 transition-transform cursor-pointer select-none">
                    🌯
                  </button>
                </div>
                <p class="text-center text-gray-600 mt-4">Нажми на шаурму!</p>
              </div>

              <!-- Улучшения -->
              <div class="bg-white rounded-2xl p-4 shadow-xl">
                <h2 class="text-xl font-bold mb-3">📈 Улучшения</h2>
                <div class="space-y-2">
                  ${gameState.upgrades.map(upgrade => `
                    <button
                      onclick="buyUpgradeGlobal(${upgrade.id})"
                      ${upgrade.purchased || gameState.shawarmas < upgrade.cost ? 'disabled' : ''}
                      class="w-full p-3 rounded-lg text-left transition-all ${
                        upgrade.purchased
                          ? 'bg-green-100 border-2 border-green-400 cursor-default'
                          : gameState.shawarmas >= upgrade.cost
                          ? 'bg-orange-50 hover:bg-orange-100 active:bg-orange-200 border-2 border-orange-300 cursor-pointer'
                          : 'bg-gray-100 border-2 border-gray-300 opacity-50 cursor-not-allowed'
                      }"
                    >
                      <div class="flex justify-between items-center">
                        <div>
                          <div class="font-semibold">${upgrade.name}</div>
                          <div class="text-sm text-gray-600">
                            ${upgrade.purchased ? '✅ Куплено' : `+${upgrade.clickBonus} за клик`}
                          </div>
                        </div>
                        ${!upgrade.purchased ? `<div class="text-orange-600 font-bold">${upgrade.cost} 🌯</div>` : ''}
                      </div>
                    </button>
                  `).join('')}
                </div>
              </div>

              <!-- Магазин -->
              <div class="bg-white rounded-2xl p-4 shadow-xl">
                <h2 class="text-xl font-bold mb-3">🏪 Магазин</h2>
                <div class="space-y-2">
                  ${gameState.buildings.map(building => `
                    <button
                      onclick="buyBuildingGlobal(${building.id})"
                      ${gameState.shawarmas < building.cost ? 'disabled' : ''}
                      class="w-full p-3 rounded-lg text-left transition-all ${
                        gameState.shawarmas >= building.cost
                          ? 'bg-orange-50 hover:bg-orange-100 active:bg-orange-200 border-2 border-orange-300 cursor-pointer'
                          : 'bg-gray-100 border-2 border-gray-300 opacity-50 cursor-not-allowed'
                      }"
                    >
                      <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                          <div class="text-3xl">${building.emoji}</div>
                          <div>
                            <div class="font-semibold">${building.name}</div>
                            <div class="text-sm text-gray-600">+${building.production}/сек</div>
                            <div class="text-xs text-gray-500">Куплено: ${building.owned}</div>
                          </div>
                        </div>
                        <div class="text-orange-600 font-bold">${building.cost} 🌯</div>
                      </div>
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // Автопроизводство
      setInterval(() => {
        gameState.shawarmas += gameState.perSecond / 10;
        render();
      }, 100);

      // Автосохранение каждые 5 секунд
      setInterval(saveGameData, 5000);

      // Глобальные функции для кнопок
      window.handleClickGlobal = handleClick;
      window.buyBuildingGlobal = buyBuilding;
      window.buyUpgradeGlobal = buyUpgrade;

      // Запуск приложения
      loadGameData();
    })();
  </script>
</body>
</html>
