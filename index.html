<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Империя Шаурмы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Встроенные критичные стили для загрузки */
    @keyframes float-up {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
    }
    .float-number {
      animation: float-up 1s ease-out forwards;
      pointer-events: none;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-5px) rotate(-5deg); }
      75% { transform: translateX(5px) rotate(5deg); }
    }
    .shake {
      animation: shake 0.3s ease-in-out;
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .achievement-popup {
      animation: slideInRight 0.5s ease-out;
    }
    @keyframes particle-burst {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
    }
    .particle {
      animation: particle-burst 0.8s ease-out forwards;
    }
    @keyframes golden-shine {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .golden-shine {
      background: linear-gradient(90deg, transparent, rgba(255,215,0,0.5), transparent);
      background-size: 200% 100%;
      animation: golden-shine 2s infinite;
    }
    @keyframes bounce-in {
      0% { transform: scale(0); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .bounce-in {
      animation: bounce-in 0.5s ease-out;
    }
    .overflow-y-auto::-webkit-scrollbar {
      width: 8px;
    }
    .overflow-y-auto::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    .overflow-y-auto::-webkit-scrollbar-thumb {
      background: #fb923c;
      border-radius: 10px;
    }
    .overflow-y-auto::-webkit-scrollbar-thumb:hover {
      background: #f97316;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-orange-100 via-yellow-50 to-red-100">
  <!-- Экран загрузки -->
  <div id="app">
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center">
        <div class="text-6xl mb-4 animate-pulse">🌯</div>
        <div class="text-2xl font-bold text-orange-600">Загрузка игры...</div>
        <div class="text-sm text-gray-500 mt-2">Подождите немного</div>
      </div>
    </div>
  </div>

  <!-- Контейнер для уведомлений -->
  <div id="achievements-container" class="fixed top-20 right-4 z-50 space-y-2"></div>
  
  <!-- Контейнер для частиц -->
  <div id="particles-container" class="fixed inset-0 pointer-events-none z-40"></div>
  
  <!-- Модальное окно ежедневной награды -->
  <div id="daily-reward-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-8 max-w-sm mx-4 bounce-in">
      <div class="text-center">
        <div class="text-6xl mb-4">🎁</div>
        <h2 class="text-2xl font-bold text-orange-600 mb-2">Ежедневная награда!</h2>
        <p class="text-gray-600 mb-4">Возвращайся каждый день за бонусами!</p>
        <div class="bg-gradient-to-r from-orange-100 to-yellow-100 rounded-2xl p-6 mb-4">
          <div class="text-4xl font-bold text-orange-600" id="daily-reward-amount">+1000 🌯</div>
          <div class="text-sm text-gray-600 mt-2">День <span id="daily-streak">1</span></div>
        </div>
        <button onclick="Game.claimDailyReward()" class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold py-3 px-6 rounded-xl hover:from-orange-600 hover:to-red-600 transition-all">
          Забрать награду! 🎉
        </button>
      </div>
    </div>
  </div>

  <!-- Модальное окно престижа -->
  <div id="prestige-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-8 max-w-md mx-4 bounce-in">
      <div class="text-center">
        <div class="text-6xl mb-4">⭐</div>
        <h2 class="text-2xl font-bold text-orange-600 mb-2">Престиж</h2>
        <p class="text-gray-600 mb-4">Начни заново с мощными бонусами!</p>
        <div class="bg-gradient-to-r from-purple-100 to-pink-100 rounded-2xl p-6 mb-4">
          <div class="text-lg font-semibold mb-2">Текущий прогресс:</div>
          <div class="text-sm text-gray-600 space-y-1">
            <div>Всего шаурмы: <span class="font-bold text-orange-600" id="prestige-total"></span></div>
            <div>Зданий куплено: <span class="font-bold text-orange-600" id="prestige-buildings"></span></div>
          </div>
          <div class="mt-4 pt-4 border-t-2 border-purple-300">
            <div class="text-lg font-bold text-purple-600">Получишь: x<span id="prestige-bonus">1.5</span> множитель!</div>
            <div class="text-xs text-gray-500 mt-1">Применяется ко всему производству</div>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="Game.closePrestigeModal()" class="flex-1 bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl hover:bg-gray-400 transition-all">
            Отмена
          </button>
          <button onclick="Game.confirmPrestige()" class="flex-1 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-3 px-6 rounded-xl hover:from-purple-600 hover:to-pink-600 transition-all">
            Престиж! ⭐
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Подключаем JavaScript модули в правильном порядке -->
  <script>
    // Логирование для отладки
    console.log('🌯 Начало загрузки скриптов...');
    console.log('Telegram WebApp доступен:', typeof window.Telegram !== 'undefined');
    
    // Проверка загрузки каждого скрипта
    window.addEventListener('error', function(e) {
      console.error('Ошибка загрузки:', e);
      if (e.target.tagName === 'SCRIPT') {
        document.getElementById('app').innerHTML = `
          <div class="flex items-center justify-center min-h-screen p-4">
            <div class="text-center bg-red-100 border-2 border-red-400 rounded-xl p-6">
              <div class="text-4xl mb-4">❌</div>
              <div class="text-xl font-bold text-red-600 mb-2">Ошибка загрузки</div>
              <div class="text-sm text-gray-700">Не удалось загрузить файл: ${e.target.src}</div>
              <button onclick="location.reload()" class="mt-4 bg-red-500 text-white px-4 py-2 rounded-lg">
                Перезагрузить
              </button>
            </div>
          </div>
        `;
      }
    }, true);
  </script>
  <script src="/js/config.js" onerror="console.error('Failed to load config.js')"></script>
  <script src="/js/sounds.js" onerror="console.error('Failed to load sounds.js')"></script>
  <script src="/js/storage.js" onerror="console.error('Failed to load storage.js')"></script>
  <script src="/js/game.js" onerror="console.error('Failed to load game.js')"></script>
  <script src="/js/ui.js" onerror="console.error('Failed to load ui.js')"></script>
  <script src="/js/main.js" onerror="console.error('Failed to load main.js')"></script>
  <script>
    console.log('✅ Все скрипты загружены');
  </script>
</body>
</html>
