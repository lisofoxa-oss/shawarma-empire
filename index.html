<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Империя Шаурмы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes float-up {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
    }
    .float-number {
      animation: float-up 1s ease-out forwards;
      pointer-events: none;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 0.3; }
      100% { transform: scale(0.8); opacity: 0.8; }
    }
    .pulse-ring {
      animation: pulse-ring 2s infinite;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-5px) rotate(-5deg); }
      75% { transform: translateX(5px) rotate(5deg); }
    }
    .shake {
      animation: shake 0.3s ease-in-out;
    }
    .achievement-popup {
      animation: slideInRight 0.5s ease-out;
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes particle-burst {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
    }
    .particle {
      animation: particle-burst 0.8s ease-out forwards;
    }
    @keyframes golden-shine {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .golden-shine {
      background: linear-gradient(90deg, transparent, rgba(255,215,0,0.5), transparent);
      background-size: 200% 100%;
      animation: golden-shine 2s infinite;
    }
    @keyframes bounce-in {
      0% { transform: scale(0); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .bounce-in {
      animation: bounce-in 0.5s ease-out;
    }
    .overflow-y-auto::-webkit-scrollbar {
      width: 8px;
    }
    .overflow-y-auto::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    .overflow-y-auto::-webkit-scrollbar-thumb {
      background: #fb923c;
      border-radius: 10px;
    }
    .overflow-y-auto::-webkit-scrollbar-thumb:hover {
      background: #f97316;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-orange-100 via-yellow-50 to-red-100">
  <div id="app"></div>
  <div id="achievements-container" class="fixed top-20 right-4 z-50 space-y-2"></div>
  <div id="particles-container" class="fixed inset-0 pointer-events-none z-40"></div>
  
  <div id="daily-reward-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-8 max-w-sm mx-4 bounce-in">
      <div class="text-center">
        <div class="text-6xl mb-4">🎁</div>
        <h2 class="text-2xl font-bold text-orange-600 mb-2">Ежедневная награда!</h2>
        <p class="text-gray-600 mb-4">Возвращайся каждый день за бонусами!</p>
        <div class="bg-gradient-to-r from-orange-100 to-yellow-100 rounded-2xl p-6 mb-4">
          <div class="text-4xl font-bold text-orange-600" id="daily-reward-amount">+1000 🌯</div>
          <div class="text-sm text-gray-600 mt-2">День <span id="daily-streak">1</span></div>
        </div>
        <button onclick="claimDailyReward()" class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold py-3 px-6 rounded-xl hover:from-orange-600 hover:to-red-600 transition-all">
          Забрать награду! 🎉
        </button>
      </div>
    </div>
  </div>

  <div id="prestige-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-8 max-w-md mx-4 bounce-in">
      <div class="text-center">
        <div class="text-6xl mb-4">⭐</div>
        <h2 class="text-2xl font-bold text-orange-600 mb-2">Престиж</h2>
        <p class="text-gray-600 mb-4">Начни заново с мощными бонусами!</p>
        <div class="bg-gradient-to-r from-purple-100 to-pink-100 rounded-2xl p-6 mb-4">
          <div class="text-lg font-semibold mb-2">Текущий прогресс:</div>
          <div class="text-sm text-gray-600 space-y-1">
            <div>Всего шаурмы: <span class="font-bold text-orange-600" id="prestige-total"></span></div>
            <div>Зданий куплено: <span class="font-bold text-orange-600" id="prestige-buildings"></span></div>
          </div>
          <div class="mt-4 pt-4 border-t-2 border-purple-300">
            <div class="text-lg font-bold text-purple-600">Получишь: x<span id="prestige-bonus">1.5</span> множитель!</div>
            <div class="text-xs text-gray-500 mt-1">Применяется ко всему производству</div>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="closePrestigeModal()" class="flex-1 bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl hover:bg-gray-400 transition-all">
            Отмена
          </button>
          <button onclick="confirmPrestige()" class="flex-1 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-3 px-6 rounded-xl hover:from-purple-600 hover:to-pink-600 transition-all">
            Престиж! ⭐
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const isTelegram = window.Telegram && window.Telegram.WebApp;
      let tg = null;
      
      if (isTelegram) {
        tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
      }

      const SUPABASE_URL = 'YOUR_SUPABASE_URL';
      const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
      let supabaseClient = null;
      
      if (SUPABASE_URL !== 'YOUR_SUPABASE_URL' && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }

      const userId = isTelegram && tg.initDataUnsafe?.user?.id 
        ? tg.initDataUnsafe.user.id 
        : Math.floor(Math.random() * 1000000);

      const gameState = {
        shawarmas: 0,
        totalShawarmas: 0,
        lifetimeShawarmas: 0,
        perClick: 1,
        perSecond: 0,
        clickCount: 0,
        prestigeLevel: 0,
        prestigeBonus: 1,
        lastPlayTime: Date.now(),
        dailyStreak: 0,
        lastDailyReward: 0,
        buildings: [
          { id: 1, name: 'Стажёр', cost: 15, owned: 0, production: 0.1, emoji: '👨‍🍳', desc: 'Учится крутить шаурму' },
          { id: 2, name: 'Шаурмист', cost: 100, owned: 0, production: 1, emoji: '🧑‍🍳', desc: 'Опытный мастер' },
          { id: 3, name: 'Киоск', cost: 500, owned: 0, production: 5, emoji: '🏪', desc: 'Маленькая точка продаж' },
          { id: 4, name: 'Тележка', cost: 2000, owned: 0, production: 15, emoji: '🛒', desc: 'Мобильная торговля' },
          { id: 5, name: 'Кафе', cost: 5000, owned: 0, production: 40, emoji: '🍽️', desc: 'Уютное заведение' },
          { id: 6, name: 'Фудтрак', cost: 15000, owned: 0, production: 100, emoji: '🚚', desc: 'Шаурма на колёсах' },
          { id: 7, name: 'Ресторан', cost: 40000, owned: 0, production: 250, emoji: '🏢', desc: 'Престижное место' },
          { id: 8, name: 'Сеть', cost: 100000, owned: 0, production: 600, emoji: '🌐', desc: 'Франшиза по городу' },
          { id: 9, name: 'Фабрика', cost: 500000, owned: 0, production: 2000, emoji: '🏭', desc: 'Массовое производство' },
          { id: 10, name: 'Корпорация', cost: 2000000, owned: 0, production: 8000, emoji: '🏛️', desc: 'Международный бренд' },
          { id: 11, name: 'Мегакорп', cost: 10000000, owned: 0, production: 30000, emoji: '🌍', desc: 'Мировое господство' },
          { id: 12, name: 'Космостанция', cost: 50000000, owned: 0, production: 100000, emoji: '🛸', desc: 'Шаурма в космосе!' },
        ],
        upgrades: [
          { id: 1, name: 'Острый соус', cost: 50, purchased: false, clickBonus: 1, type: 'click', emoji: '🌶️' },
          { id: 2, name: 'Свежие овощи', cost: 200, purchased: false, clickBonus: 2, type: 'click', emoji: '🥬' },
          { id: 3, name: 'Премиум мясо', cost: 1000, purchased: false, clickBonus: 5, type: 'click', emoji: '🥩' },
          { id: 4, name: 'Секретная приправа', cost: 5000, purchased: false, clickBonus: 10, type: 'click', emoji: '✨' },
          { id: 5, name: 'Золотой лаваш', cost: 25000, purchased: false, clickBonus: 25, type: 'click', emoji: '🏆' },
          { id: 6, name: 'Алмазный нож', cost: 100000, purchased: false, clickBonus: 50, type: 'click', emoji: '💎' },
          
          { id: 7, name: 'Быстрые руки', cost: 500, purchased: false, productionMultiplier: 1.5, type: 'production', emoji: '⚡' },
          { id: 8, name: 'Автоматизация', cost: 3000, purchased: false, productionMultiplier: 2, type: 'production', emoji: '🤖' },
          { id: 9, name: 'Турборежим', cost: 15000, purchased: false, productionMultiplier: 2.5, type: 'production', emoji: '🚀' },
          { id: 10, name: 'Квантовая печь', cost: 75000, purchased: false, productionMultiplier: 3, type: 'production', emoji: '⚛️' },
          { id: 11, name: 'Временной ускоритель', cost: 500000, purchased: false, productionMultiplier: 5, type: 'production', emoji: '⏰' },
          
          { id: 12, name: 'Дешёвая аренда', cost: 2000, purchased: false, buildingDiscount: 0.9, type: 'discount', emoji: '💰' },
          { id: 13, name: 'Оптовые закупки', cost: 10000, purchased: false, buildingDiscount: 0.85, type: 'discount', emoji: '📦' },
          { id: 14, name: 'Связи в мэрии', cost: 50000, purchased: false, buildingDiscount: 0.8, type: 'discount', emoji: '🏛️' },
          { id: 15, name: 'Монополия', cost: 250000, purchased: false, buildingDiscount: 0.75, type: 'discount', emoji: '👑' },
        ],
        achievements: [
          { id: 1, name: 'Первые шаги', desc: 'Создай 10 шаурмы', target: 10, type: 'total', unlocked: false, reward: 50 },
          { id: 2, name: 'Любитель', desc: 'Создай 100 шаурмы', target: 100, type: 'total', unlocked: false, reward: 200 },
          { id: 3, name: 'Мастер', desc: 'Создай 1000 шаурмы', target: 1000, type: 'total', unlocked: false, reward: 1000 },
          { id: 4, name: 'Магнат', desc: 'Создай 10000 шаурмы', target: 10000, type: 'total', unlocked: false, reward: 5000 },
          { id: 5, name: 'Легенда', desc: 'Создай 100000 шаурмы', target: 100000, type: 'total', unlocked: false, reward: 25000 },
          { id: 6, name: 'Титан', desc: 'Создай 1000000 шаурмы', target: 1000000, type: 'total', unlocked: false, reward: 100000 },
          
          { id: 7, name: 'Кликер', desc: 'Кликни 100 раз', target: 100, type: 'clicks', unlocked: false, reward: 100 },
          { id: 8, name: 'Безумный кликер', desc: 'Кликни 1000 раз', target: 1000, type: 'clicks', unlocked: false, reward: 500 },
          { id: 9, name: 'Бог кликов', desc: 'Кликни 10000 раз', target: 10000, type: 'clicks', unlocked: false, reward: 2500 },
          
          { id: 10, name: 'Предприниматель', desc: 'Купи 10 зданий', target: 10, type: 'buildings', unlocked: false, reward: 300 },
          { id: 11, name: 'Империя', desc: 'Купи 50 зданий', target: 50, type: 'buildings', unlocked: false, reward: 1500 },
          { id: 12, name: 'Монополист', desc: 'Купи 100 зданий', target: 100, type: 'buildings', unlocked: false, reward: 5000 },
          
          { id: 13, name: 'Первый престиж', desc: 'Достигни 1 престижа', target: 1, type: 'prestige', unlocked: false, reward: 10000 },
          { id: 14, name: 'Мастер престижа', desc: 'Достигни 5 престижа', target: 5, type: 'prestige', unlocked: false, reward: 50000 },
        ],
        currentTab: 'buildings'
      };

      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      
      function playSound(frequency, duration, type = 'sine') {
        try {
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          oscillator.frequency.value = frequency;
          oscillator.type = type;
          
          gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
          
          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + duration);
        } catch (e) {}
      }

      function playClickSound() {
        playSound(800, 0.1, 'sine');
      }

      function playPurchaseSound() {
        playSound(600, 0.15, 'square');
        setTimeout(() => playSound(800, 0.15, 'square'), 100);
      }

      function playAchievementSound() {
        playSound(523, 0.2, 'sine');
        setTimeout(() => playSound(659, 0.2, 'sine'), 150);
        setTimeout(() => playSound(784, 0.3, 'sine'), 300);
      }

      async function loadGameData() {
        try {
          const saved = localStorage.getItem('shawarma_game_' + userId);
          if (saved) {
            const data = JSON.parse(saved);
            Object.assign(gameState, {
              shawarmas: data.shawarmas || 0,
              totalShawarmas: data.totalShawarmas || 0,
              lifetimeShawarmas: data.lifetimeShawarmas || 0,
              perClick: data.perClick || 1,
              clickCount: data.clickCount || 0,
              prestigeLevel: data.prestigeLevel || 0,
              prestigeBonus: data.prestigeBonus || 1,
              lastPlayTime: data.lastPlayTime || Date.now(),
              dailyStreak: data.dailyStreak || 0,
              lastDailyReward: data.lastDailyReward || 0,
            });
            
            if (data.buildings) {
              data.buildings.forEach(savedBuilding => {
                const building = gameState.buildings.find(b => b.id === savedBuilding.id);
                if (building) {
                  building.owned = savedBuilding.owned;
                  building.cost = savedBuilding.cost;
                }
              });
            }
            
            if (data.upgrades) {
              data.upgrades.forEach(savedUpgrade => {
                const upgrade = gameState.upgrades.find(u => u.id === savedUpgrade.id);
                if (upgrade) upgrade.purchased = savedUpgrade.purchased;
              });
            }

            if (data.achievements) {
              data.achievements.forEach(savedAch => {
                const achievement = gameState.achievements.find(a => a.id === savedAch.id);
                if (achievement) achievement.unlocked = savedAch.unlocked;
              });
            }
          }

          calculateOfflineProgress();
          calculateProduction();
          checkDailyReward();
          render();
        } catch (error) {
          console.error('Ошибка загрузки:', error);
          calculateProduction();
          render();
        }
      }

      function calculateOfflineProgress() {
        const now = Date.now();
        const timePassed = (now - gameState.lastPlayTime) / 1000;
        
        if (timePassed > 10 && gameState.perSecond > 0) {
          const maxOfflineTime = 4 * 60 * 60;
          const actualTime = Math.min(timePassed, maxOfflineTime);
          const offlineProduction = gameState.perSecond * actualTime;
          
          if (offlineProduction > 0) {
            gameState.shawarmas += offlineProduction;
            gameState.totalShawarmas += offlineProduction;
            gameState.lifetimeShawarmas += offlineProduction;
            
            const hours = Math.floor(actualTime / 3600);
            const minutes = Math.floor((actualTime % 3600) / 60);
            const timeStr = hours > 0 ? `${hours}ч ${minutes}м` : `${minutes}м`;
            
            showAchievementPopup({
              name: 'Офлайн прогресс',
              desc: `Ты отсутствовал ${timeStr}`,
              reward: Math.floor(offlineProduction),
              emoji: '💤'
            });
          }
        }
        
        gameState.lastPlayTime = now;
      }

      function checkDailyReward() {
        const now = Date.now();
        const lastReward = gameState.lastDailyReward;
        const dayInMs = 24 * 60 * 60 * 1000;
        
        if (now - lastReward > dayInMs) {
          const daysSince = Math.floor((now - lastReward) / dayInMs);
          
          if (daysSince === 1) {
            gameState.dailyStreak++;
          } else if (daysSince > 1) {
            gameState.dailyStreak = 1;
          }
          
          showDailyRewardModal();
        }
      }

      function showDailyRewardModal() {
        const modal = document.getElementById('daily-reward-modal');
        const reward = 1000 * gameState.dailyStreak;
        
        document.getElementById('daily-reward-amount').textContent = '+' + formatNumber(reward) + ' 🌯';
        document.getElementById('daily-streak').textContent = gameState.dailyStreak;
        
        modal.classList.remove('hidden');
        playAchievementSound();
      }

      function claimDailyReward() {
        const reward = 1000 * gameState.dailyStreak;
        gameState.shawarmas += reward;
        gameState.totalShawarmas += reward;
        gameState.lifetimeShawarmas += reward;
        gameState.lastDailyReward = Date.now();
        
        document.getElementById('daily-reward-modal').classList.add('hidden');
        createParticles(window.innerWidth / 2, window.innerHeight / 2, 20, '🎁');
        saveGameData();
        render();
      }

      async function saveGameData() {
        try {
          const saveData = {
            shawarmas: gameState.shawarmas,
            totalShawarmas: gameState.totalShawarmas,
            lifetimeShawarmas: gameState.lifetimeShawarmas,
            perClick: gameState.perClick,
            clickCount: gameState.clickCount,
            prestigeLevel: gameState.prestigeLevel,
            prestigeBonus: gameState.prestigeBonus,
            lastPlayTime: Date.now(),
            dailyStreak: gameState.dailyStreak,
            lastDailyReward: gameState.lastDailyReward,
            buildings: gameState.buildings.map(b => ({ id: b.id, owned: b.owned, cost: b.cost })),
            upgrades: gameState.upgrades.map(u => ({ id: u.id, purchased: u.purchased })),
            achievements: gameState.achievements.map(a => ({ id: a.id, unlocked: a.unlocked }))
          };
          localStorage.setItem('shawarma_game_' + userId, JSON.stringify(saveData));
        } catch (error) {
          console.error('Ошибка сохранения:', error);
        }
      }

      function calculateProduction() {
        let baseProduction = gameState.buildings.reduce((sum, b) => sum + (b.owned * b.production), 0);
        
        const productionMultiplier = gameState.upgrades
          .filter(u => u.purchased && u.type === 'production')
          .reduce((mult, u) => mult * u.productionMultiplier, 1);
        
        gameState.perSecond = baseProduction * productionMultiplier * gameState.prestigeBonus;
        
        gameState.perClick = 1 + gameState.upgrades
          .filter(u => u.purchased && u.type === 'click')
          .reduce((sum, u) => sum + u.clickBonus, 0);
        
        gameState.perClick *= gameState.prestigeBonus;
      }

      function checkAchievements() {
        const totalBuildings = gameState.buildings.reduce((sum, b) => sum + b.owned, 0);
        
        gameState.achievements.forEach(ach => {
          if (ach.unlocked) return;
          
          let progress = 0;
          if (ach.type === 'total') progress = gameState.totalShawarmas;
          if (ach.type === 'clicks') progress = gameState.clickCount;
          if (ach.type === 'buildings') progress = totalBuildings;
          if (ach.type === 'prestige') progress = gameState.prestigeLevel;
          
          if (progress >= ach.target) {
            ach.unlocked = true;
            gameState.shawarmas += ach.reward;
            showAchievementPopup(ach);
            playAchievementSound();
          }
        });
      }

      function showAchievementPopup(ach) {
        const container = document.getElementById('achievements-container');
        const div = document.createElement('div');
        div.className = 'achievement-popup bg-gradient-to-r from-yellow-400 to-orange-500 text-white p-4 rounded-lg shadow-2xl max-w-xs';
        div.innerHTML = `
          <div class="font-bold text-lg">${ach.emoji || '🏆'} ${ach.reward > 0 ? 'Достижение!' : 'Уведомление'}</div>
          <div class="font-semibold">${ach.name}</div>
          <div class="text-sm opacity-90">${ach.desc}</div>
          ${ach.reward > 0 ? `<div class="text-sm font-bold mt-1">+${formatNumber(ach.reward)} 🌯</div>` : ''}
        `;
        container.appendChild(div);
        
        setTimeout(() => {
          div.style.opacity = '0';
          div.style.transition = 'opacity 0.5s';
          setTimeout(() => div.remove(), 500);
        }, 3000);
      }

      function showFloatingNumber(x, y, value) {
        const div = document.createElement('div');
        div.className = 'float-number fixed text-3xl font-bold text-orange-600 z-50';
        div.textContent = '+' + formatNumber(value);
        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.textShadow = '2px 2px 4px rgba(0,0,0,0.3)';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 1000);
      }

      function createParticles(x, y, count, emoji = '🌯') {
        const container = document.getElementById('particles-container');
        
        for (let i = 0; i < count; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle fixed text-2xl';
          particle.textContent = emoji;
          particle.style.left = x + 'px';
          particle.style.top = y + 'px';
          
          const angle = (Math.PI * 2 * i) / count;
          const distance = 50 + Math.random() * 50;
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance;
          
          particle.style.setProperty('--tx', tx + 'px');
          particle.style.setProperty('--ty', ty + 'px');
          
          container.appendChild(particle);
          setTimeout(() => particle.remove(), 800);
        }
      }

      function handleClick(event) {
        gameState.shawarmas += gameState.perClick;
        gameState.totalShawarmas += gameState.perClick;
        gameState.lifetimeShawarmas += gameState.perClick;
        gameState.clickCount++;
        const shawarmaBtn = document.getElementById('shawarma-btn');
    if (shawarmaBtn) {
      shawarmaBtn.classList.add('shake');
      setTimeout(() => shawarmaBtn.classList.remove('shake'), 300);
    }
    
    showFloatingNumber(event.clientX, event.clientY, gameState.perClick);
    playClickSound();
    
    if (Math.random() < 0.1) {
      createParticles(event.clientX, event.clientY, 5);
    }
    
    if (isTelegram && tg.HapticFeedback) {
      tg.HapticFeedback.impactOccurred('light');
    }
    
    checkAchievements();
    render();
  }

  function buyBuilding(buildingId) {
    const building = gameState.buildings.find(b => b.id === buildingId);
    if (!building) return;
    
    let finalCost = building.cost;
    
    const discount = gameState.upgrades
      .filter(u => u.purchased && u.type === 'discount')
      .reduce((disc, u) => disc * u.buildingDiscount, 1);
    
    finalCost = Math.floor(finalCost * discount);
    
    if (gameState.shawarmas >= finalCost) {
      gameState.shawarmas -= finalCost;
      building.owned++;
      building.cost = Math.floor(building.cost * 1.15);
      
      calculateProduction();
      saveGameData();
      playPurchaseSound();
      
      if (isTelegram && tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
      
      checkAchievements();
      render();
    }
  }

  function buyUpgrade(upgradeId) {
    const upgrade = gameState.upgrades.find(u => u.id === upgradeId);
    if (!upgrade || upgrade.purchased) return;
    
    if (gameState.shawarmas >= upgrade.cost) {
      gameState.shawarmas -= upgrade.cost;
      upgrade.purchased = true;
      
      calculateProduction();
      saveGameData();
      playPurchaseSound();
      
      if (isTelegram && tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
      
      render();
    }
  }

  function openPrestigeModal() {
    if (gameState.totalShawarmas < 1000000) {
      showAchievementPopup({
        name: 'Недостаточно прогресса',
        desc: 'Нужно минимум 1M шаурмы для престижа',
        reward: 0,
        emoji: '⚠️'
      });
      return;
    }
    
    const totalBuildings = gameState.buildings.reduce((sum, b) => sum + b.owned, 0);
    const newBonus = 1 + (gameState.lifetimeShawarmas / 1000000) * 0.5;
    
    document.getElementById('prestige-total').textContent = formatNumber(gameState.totalShawarmas);
    document.getElementById('prestige-buildings').textContent = totalBuildings;
    document.getElementById('prestige-bonus').textContent = newBonus.toFixed(2);
    
    document.getElementById('prestige-modal').classList.remove('hidden');
  }

  function closePrestigeModal() {
    document.getElementById('prestige-modal').classList.add('hidden');
  }

  function confirmPrestige() {
    gameState.prestigeLevel++;
    gameState.prestigeBonus = 1 + (gameState.lifetimeShawarmas / 1000000) * 0.5;
    
    gameState.shawarmas = 0;
    gameState.totalShawarmas = 0;
    
    gameState.buildings.forEach((b, index) => {
      b.owned = 0;
      const originalCosts = [15, 100, 500, 2000, 5000, 15000, 40000, 100000, 500000, 2000000, 10000000, 50000000];
      b.cost = originalCosts[index];
    });
    
    gameState.upgrades.forEach(u => u.purchased = false);
    
    closePrestigeModal();
    playAchievementSound();
    createParticles(window.innerWidth / 2, window.innerHeight / 2, 30, '⭐');
    
    showAchievementPopup({
      name: 'Престиж достигнут!',
      desc: `Множитель: x${gameState.prestigeBonus.toFixed(2)}`,
      reward: 0,
      emoji: '⭐'
    });
    
    checkAchievements();
    calculateProduction();
    saveGameData();
    render();
  }

  function formatNumber(num) {
    if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
    if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
    if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
    if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
    return Math.floor(num).toString();
  }

  function render() {
    const unlockedAchievements = gameState.achievements.filter(a => a.unlocked).length;
    const canPrestige = gameState.totalShawarmas >= 1000000;
    
    document.getElementById('app').innerHTML = `
      <div class="min-h-screen pb-20">
        <div class="bg-gradient-to-r from-orange-500 via-red-500 to-orange-600 text-white p-4 shadow-lg sticky top-0 z-10">
          <div class="flex justify-between items-center mb-2">
            <h1 class="text-3xl font-bold">🌯 Империя Шаурмы</h1>
            ${canPrestige ? '<button onclick="openPrestigeModal()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg font-bold text-sm golden-shine">⭐ Престиж</button>' : ''}
          </div>
          ${!isTelegram ? '<div class="text-center text-xs opacity-75 mb-2">🌐 Режим браузера</div>' : ''}
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-white bg-opacity-20 rounded-lg p-2">
              <div class="text-2xl font-bold">${formatNumber(gameState.shawarmas)}</div>
              <div class="text-xs opacity-90">Шаурмы</div>
            </div>
            <div class="bg-white bg-opacity-20 rounded-lg p-2">
              <div class="text-lg font-bold">+${formatNumber(gameState.perClick)}</div>
              <div class="text-xs opacity-90">За клик</div>
            </div>
            <div class="bg-white bg-opacity-20 rounded-lg p-2">
              <div class="text-lg font-bold">+${formatNumber(gameState.perSecond)}/с</div>
              <div class="text-xs opacity-90">В секунду</div>
            </div>
          </div>
          ${gameState.prestigeLevel > 0 ? `<div class="text-center mt-2 text-sm bg-purple-600 bg-opacity-50 rounded-lg py-1">⭐ Престиж: ${gameState.prestigeLevel} (x${gameState.prestigeBonus.toFixed(2)} множитель)</div>` : ''}
        </div>

        <div class="max-w-2xl mx-auto p-4 space-y-4">
          <div class="bg-white rounded-2xl p-8 shadow-xl relative overflow-hidden">
            <div class="absolute inset-0 bg-orange-200 opacity-20 pulse-ring rounded-2xl"></div>
            <div class="flex justify-center relative z-10">
              <button id="shawarma-btn" onclick="handleClick(event)" class="text-9xl transform hover:scale-105 active:scale-95 transition-transform cursor-pointer select-none filter drop-shadow-2xl">
                🌯
              </button>
            </div>
            <p class="text-center text-gray-600 mt-4 font-semibold">Нажми на шаурму!</p>
            <div class="text-center text-sm text-gray-500 mt-2 space-y-1">
              <div>Всего создано: ${formatNumber(gameState.totalShawarmas)}</div>
              <div>За всё время: ${formatNumber(gameState.lifetimeShawarmas)} | Кликов: ${gameState.clickCount}</div>
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="grid grid-cols-3 gap-0 border-b-2 border-gray-200">
              <button onclick="switchTab('buildings')" class="p-3 font-semibold transition-all ${gameState.currentTab === 'buildings' ? 'bg-gradient-to-b from-orange-500 to-orange-600 text-white shadow-lg' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
                🏪 Магазин
              </button>
              <button onclick="switchTab('upgrades')" class="p-3 font-semibold transition-all ${gameState.currentTab === 'upgrades' ? 'bg-gradient-to-b from-orange-500 to-orange-600 text-white shadow-lg' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
                ⚡ Улучшения
              </button>
              <button onclick="switchTab('achievements')" class="p-3 font-semibold transition-all ${gameState.currentTab === 'achievements' ? 'bg-gradient-to-b from-orange-500 to-orange-600 text-white shadow-lg' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
                🏆 ${unlockedAchievements > 0 ? `(${unlockedAchievements})` : 'Награды'}
              </button>
            </div>

            <div class="p-4 max-h-96 overflow-y-auto">
              ${gameState.currentTab === 'buildings' ? renderBuildings() : ''}
              ${gameState.currentTab === 'upgrades' ? renderUpgrades() : ''}
              ${gameState.currentTab === 'achievements' ? renderAchievements() : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function renderBuildings() {
    return `
      <div class="space-y-2">
        ${gameState.buildings.map(building => {
          const discount = gameState.upgrades
            .filter(u => u.purchased && u.type === 'discount')
            .reduce((disc, u) => disc * u.buildingDiscount, 1);
          const finalCost = Math.floor(building.cost * discount);
          const canBuy = gameState.shawarmas >= finalCost;
          
          return `
            <button
              onclick="buyBuilding(${building.id})"
              ${!canBuy ? 'disabled' : ''}
              class="w-full p-3 rounded-xl text-left transition-all transform ${
                canBuy
                  ? 'bg-gradient-to-r from-orange-50 to-yellow-50 hover:from-orange-100 hover:to-yellow-100 border-2 border-orange-400 cursor-pointer shadow-md hover:shadow-xl hover:scale-105 active:scale-95'
                  : 'bg-gray-100 border-2 border-gray-300 opacity-50 cursor-not-allowed'
              }"
            >
              <div class="flex justify-between items-center">
                <div class="flex items-center gap-3 flex-1">
                  <div class="text-4xl filter drop-shadow-lg">${building.emoji}</div>
                  <div class="flex-1">
                    <div class="font-bold text-lg">${building.name}</div>
                    <div class="text-xs text-gray-600">${building.desc}</div>
                    <div class="text-sm text-orange-600 font-semibold mt-1">+${formatNumber(building.production * gameState.prestigeBonus)}/с</div>
                    <div class="text-xs text-gray-500">Куплено: ${building.owned}</div>
                  </div>
                </div>
                <div class="text-right">
                  <div class="text-orange-600 font-bold text-xl">${formatNumber(finalCost)}</div>
                  <div class="text-xs text-gray-500">🌯</div>
                  ${discount < 1 ? '<div class="text-xs text-green-600 font-semibold">-' + Math.floor((1 - discount) * 100) + '%</div>' : ''}
                </div>
              </div>
            </button>
          `;
        }).join('')}
      </div>
    `;
  }

  function renderUpgrades() {
    const clickUpgrades = gameState.upgrades.filter(u => u.type === 'click');
    const productionUpgrades = gameState.upgrades.filter(u => u.type === 'production');
    const discountUpgrades = gameState.upgrades.filter(u => u.type === 'discount');
    
    return `
      <div class="space-y-4">
        <div>
          <h3 class="font-bold text-lg mb-2 text-orange-600 flex items-center gap-2">
            🖱️ Сила клика
          </h3>
          <div class="space-y-2">
            ${clickUpgrades.map(u => renderUpgradeButton(u)).join('')}
          </div>
        </div>
        
        <div>
          <h3 class="font-bold text-lg mb-2 text-orange-600 flex items-center gap-2">
            ⚙️ Производство
          </h3>
          <div class="space-y-2">
            ${productionUpgrades.map(u => renderUpgradeButton(u)).join('')}
          </div>
        </div>
        
        <div>
          <h3 class="font-bold text-lg mb-2 text-orange-600 flex items-center gap-2">
            💰 Экономия
          </h3>
          <div class="space-y-2">
            ${discountUpgrades.map(u => renderUpgradeButton(u)).join('')}
          </div>
        </div>
      </div>
    `;
  }

  function renderUpgradeButton(upgrade) {
    return `
      <button
        onclick="buyUpgrade(${upgrade.id})"
        ${upgrade.purchased || gameState.shawarmas < upgrade.cost ? 'disabled' : ''}
        class="w-full p-3 rounded-xl text-left transition-all transform ${
          upgrade.purchased
            ? 'bg-gradient-to-r from-green-100 to-emerald-100 border-2 border-green-400 cursor-default'
            : gameState.shawarmas >= upgrade.cost
            ? 'bg-gradient-to-r from-orange-50 to-yellow-50 hover:from-orange-100 hover:to-yellow-100 border-2 border-orange-400 cursor-pointer shadow-md hover:shadow-xl hover:scale-105 active:scale-95'
            : 'bg-gray-100 border-2 border-gray-300 opacity-50 cursor-not-allowed'
        }"
      >
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div class="text-3xl filter drop-shadow-lg">${upgrade.emoji}</div>
            <div>
              <div class="font-semibold text-lg">${upgrade.name}</div>
              <div class="text-sm text-gray-600">
                ${upgrade.purchased ? '✅ Куплено' : 
                  upgrade.type === 'click' ? `+${upgrade.clickBonus} за клик` :
                  upgrade.type === 'production' ? `x${upgrade.productionMultiplier} производство` :
                  `${Math.floor((1 - upgrade.buildingDiscount) * 100)}% скидка`
                }
              </div>
            </div>
          </div>
          ${!upgrade.purchased ? `<div class="text-orange-600 font-bold text-lg">${formatNumber(upgrade.cost)} 🌯</div>` : ''}
        </div>
      </button>
    `;
  }

  function renderAchievements() {
    const totalBuildings = gameState.buildings.reduce((sum, b) => sum + b.owned, 0);
    
    return `
      <div class="space-y-3">
        <div class="text-center p-3 bg-gradient-to-r from-yellow-100 to-orange-100 rounded-xl">
          <div class="text-lg font-bold text-orange-600">
            ${gameState.achievements.filter(a => a.unlocked).length} / ${gameState.achievements.length}
          </div>
          <div class="text-sm text-gray-600">Разблокировано достижений</div>
        </div>
        ${gameState.achievements.map(ach => {
          let progress = 0;
          if (ach.type === 'total') progress = gameState.totalShawarmas;
          if (ach.type === 'clicks') progress = gameState.clickCount;
          if (ach.type === 'buildings') progress = totalBuildings;
          if (ach.type === 'prestige') progress = gameState.prestigeLevel;
          
          const percent = Math.min((progress / ach.target) * 100, 100);
          
          return `
            <div class="p-4 rounded-xl transition-all ${ach.unlocked ? 'bg-gradient-to-r from-yellow-100 via-orange-100 to-yellow-100 border-2 border-yellow-500 shadow-lg' : 'bg-gray-50 border-2 border-gray-300 hover:border-gray-400'}">
              <div class="flex items-start gap-3">
                <div class="text-4xl filter drop-shadow-lg">${ach.unlocked ? '🏆' : '🔒'}</div>
                <div class="flex-1">
                  <div class="font-bold text-lg ${ach.unlocked ? 'text-orange-600' : ''}">${ach.name}</div>
                  <div class="text-sm text-gray-600">${ach.desc}</div>
                  <div class="text-sm font-semibold text-orange-600 mt-1">🎁 Награда: +${formatNumber(ach.reward)} 🌯</div>
                  ${!ach.unlocked ? `
                    <div class="mt-2">
                      <div class="flex justify-between text-xs text-gray-600 mb-1">
                        <span>${formatNumber(progress)} / ${formatNumber(ach.target)}</span>
                        <span class="font-semibold">${percent.toFixed(0)}%</span>
                      </div>
                      <div class="w-full bg-gray-300 rounded-full h-3 overflow-hidden">
                        <div class="bg-gradient-to-r from-orange-400 to-orange-600 h-3 rounded-full transition-all duration-500 shadow-inner" style="width: ${percent}%"></div>
                      </div>
                    </div>
                  ` : '<div class="text-green-600 font-bold mt-1 flex items-center gap-1">✨ Разблокировано!</div>'}
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function switchTab(tab) {
    gameState.currentTab = tab;
    render();
  }

  let renderInterval;
  function startGameLoops() {
    setInterval(() => {
      gameState.shawarmas += gameState.perSecond / 10;
      gameState.totalShawarmas += gameState.perSecond / 10;
      gameState.lifetimeShawarmas += gameState.perSecond / 10;
    }, 100);

    renderInterval = setInterval(() => {
      render();
    }, 1000);

    setInterval(saveGameData, 5000);
  }

  window.handleClick = handleClick;
  window.buyBuilding = buyBuilding;
  window.buyUpgrade = buyUpgrade;
  window.switchTab = switchTab;
  window.claimDailyReward = claimDailyReward;
  window.openPrestigeModal = openPrestigeModal;
  window.closePrestigeModal = closePrestigeModal;
  window.confirmPrestige = confirmPrestige;

  loadGameData();
  startGameLoops();
})();
</script>
</body>
</html>
